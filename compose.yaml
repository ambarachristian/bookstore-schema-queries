# Describes the PostgreSQL server for this project.
services:
  db:
    image: postgres:16
    container_name: bookstore-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql
      - ./data:/data

volumes:
  pgdata:
